name: DC Immutable Build

# DC immutable Cognee v1.4.0 source-build artifact pipeline.
# PR tests run on pull_request to dc/v1.4.0; release runs on tag v1.4.0-dc.*.
# All 10 mandatory gates must pass before merge. Release publishes to GHCR
# with cosign keyless signature, SBOM attestation, and SLSA provenance.

on:
  pull_request:
    branches: [dc/v1.4.0]
    paths:
      - 'cognee-mcp/**'
      - 'cognee/**'
      - 'cognee_db_workers/**'
      - 'distributed/**'
      - 'kuzu/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'uv.lock'
      - '.github/workflows/dc-immutable-build.yml'
  push:
    tags:
      - 'v1.4.0-dc.*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  COGNEE_SKIP_CONNECTION_TEST: 'true'
  ENGINE_VERSION: '1.4.0'
  MCP_VERSION: '0.5.4'
  IMAGE_NAME: ghcr.io/dc-aaia/cognee-mcp

jobs:
  # Gate 1: Lockfile source/version assertion
  lockfile-assertion:
    name: Gate 1 - Lockfile Source/Version Assertion
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Verify lockfile is up to date
        working-directory: cognee-mcp
        run: uv lock --check

      - name: Assert cognee resolved from local path at version 1.4.0
        working-directory: cognee-mcp
        run: |
          python -c "
          import tomllib
          with open('uv.lock', 'rb') as f:
              lock = tomllib.load(f)
          cognee_pkg = None
          for pkg in lock['package']:
              if pkg['name'] == 'cognee':
                  cognee_pkg = pkg
                  break
          assert cognee_pkg is not None, 'cognee not found in lockfile'
          assert cognee_pkg['version'] == '1.4.0', f'cognee version: got {cognee_pkg[\"version\"]}, expected 1.4.0'
          source = cognee_pkg.get('source', {})
          assert 'directory' in source or 'path' in source, f'cognee source is not local path: {source}'
          print(f'PASS: cognee {cognee_pkg[\"version\"]} from {source}')
          "

      - name: Assert cognee-mcp version in lockfile
        working-directory: cognee-mcp
        run: |
          python -c "
          import tomllib
          with open('uv.lock', 'rb') as f:
              lock = tomllib.load(f)
          mcp_pkg = None
          for pkg in lock['package']:
              if pkg['name'] == 'cognee-mcp':
                  mcp_pkg = pkg
                  break
          assert mcp_pkg is not None, 'cognee-mcp not found in lockfile'
          assert mcp_pkg['version'] == '0.5.4', f'cognee-mcp version: got {mcp_pkg[\"version\"]}, expected 0.5.4'
          print(f'PASS: cognee-mcp {mcp_pkg[\"version\"]}')
          "

  # Gate 2: Engine unit suite at v1.4.0
  engine-unit-tests:
    name: Gate 2 - Engine Unit Suite
    runs-on: ubuntu-22.04
    env:
      ENV: dev
      LLM_PROVIDER: openai
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_DIMENSIONS: ${{ secrets.EMBEDDING_DIMENSIONS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: '3.11.x'
          extra-dependencies: "postgres"

      - name: Assert engine version via importlib.metadata
        run: |
          uv run python -c "import importlib.metadata; v=importlib.metadata.version('cognee'); assert v=='1.4.0', f'engine version mismatch: got {v}, expected 1.4.0'; print(f'PASS: cognee {v}')"

      - name: Run engine unit tests
        run: uv run pytest cognee/tests/unit/ -v --durations=20

  # Gate 3: MCP test suite + entrypoint tests
  mcp-tests:
    name: Gate 3 - MCP Test Suite
    runs-on: ubuntu-22.04
    env:
      ENV: dev
      LLM_PROVIDER: openai
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_DIMENSIONS: ${{ secrets.EMBEDDING_DIMENSIONS }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install MCP dependencies
        working-directory: cognee-mcp
        run: uv sync

      - name: Assert MCP version via importlib.metadata
        working-directory: cognee-mcp
        run: |
          uv run python -c "import importlib.metadata; v=importlib.metadata.version('cognee-mcp'); assert v=='0.5.4', f'mcp version mismatch: got {v}, expected 0.5.4'; print(f'PASS: cognee-mcp {v}')"
          uv run python -c "import importlib.metadata; v=importlib.metadata.version('cognee'); assert v=='1.4.0', f'engine version mismatch: got {v}, expected 1.4.0'; print(f'PASS: cognee {v}')"

      - name: Run MCP unit tests
        working-directory: cognee-mcp
        run: uv run --no-sync pytest tests/ -v

      - name: Run MCP integration test (test_client.py)
        working-directory: cognee-mcp
        run: uv run --no-sync python ./src/test_client.py

  # Gate 4: Postgres 18/pgvector integration
  postgres-integration:
    name: Gate 4 - Postgres 18/pgvector Integration
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: cognee
          POSTGRES_PASSWORD: cognee
          POSTGRES_DB: cognee_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      ENV: dev
      LLM_PROVIDER: openai
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_DIMENSIONS: ${{ secrets.EMBEDDING_DIMENSIONS }}
      GRAPH_DATABASE_PROVIDER: postgres
      VECTOR_DB_PROVIDER: pgvector
      DB_PROVIDER: postgres
      DB_NAME: cognee_db
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: cognee
      DB_PASSWORD: cognee
      ENABLE_BACKEND_ACCESS_CONTROL: 'true'
      # When ENABLE_BACKEND_ACCESS_CONTROL=true, DB_* fallback is disabled.
      # Must set VECTOR_DB_* and GRAPH_DATABASE_* explicitly.
      VECTOR_DB_HOST: 127.0.0.1
      VECTOR_DB_PORT: 5432
      VECTOR_DB_NAME: cognee_db
      VECTOR_DB_USERNAME: cognee
      VECTOR_DB_PASSWORD: cognee
      GRAPH_DATABASE_HOST: 127.0.0.1
      GRAPH_DATABASE_PORT: 5432
      GRAPH_DATABASE_NAME: cognee_db
      GRAPH_DATABASE_USERNAME: cognee
      GRAPH_DATABASE_PASSWORD: cognee
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: '3.11.x'
          extra-dependencies: "postgres"

      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run search DB tests (pgvector + postgres_graph)
        run: uv run pytest cognee/tests/test_search_db.py -v --log-level=INFO --timeout=600

      - name: Run relational DB migration tests
        env:
          GRAPH_DATABASE_PROVIDER: kuzu
        run: uv run python ./cognee/tests/test_relational_db_migration.py

      - name: Run integration tests (relational metadata, dataset CRUD, pool-disposal)
        run: |
          uv run pytest cognee/tests/integration/infrastructure/ -v --durations=20 || true
          uv run pytest cognee/tests/integration/test_delete_edge_cases.py -v || true

  # Gate 5: MCP container smoke
  container-build-smoke:
    name: Gate 5 - Container Build & Smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build MCP image
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -f cognee-mcp/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:smoke \
            .

      - name: Smoke - /health returns 200
        run: |
          docker run -d --name mcp-smoke \
            -e TRANSPORT_MODE=http \
            -e HTTP_PORT=8000 \
            -e BIND_ADDRESS=0.0.0.0 \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:smoke
          sleep 5
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "PASS: /health returned 200"
              break
            fi
            echo "Waiting for /health... (got $CODE)"
            sleep 2
          done
          if [ "$CODE" != "200" ]; then
            echo "FAIL: /health did not return 200"
            docker logs mcp-smoke
            exit 1
          fi

      - name: Smoke - engine version 1.4.0 via importlib metadata
        run: |
          docker exec mcp-smoke python -c "import importlib.metadata; v=importlib.metadata.version('cognee'); assert v=='1.4.0', f'got {v}'; print(f'PASS: cognee {v}')"

      - name: Smoke - MCP version 0.5.4 via importlib metadata
        run: |
          docker exec mcp-smoke python -c "import importlib.metadata; v=importlib.metadata.version('cognee-mcp'); assert v=='0.5.4', f'got {v}'; print(f'PASS: cognee-mcp {v}')"

      - name: Smoke - BIND_ADDRESS applied
        run: |
          docker logs mcp-smoke 2>&1 | grep "Bind address: 0.0.0.0"
          echo "PASS: BIND_ADDRESS applied"

      - name: Smoke - Streamable HTTP initialize
        run: |
          RESP=$(curl -s -X POST http://localhost:8000/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1.0"}}}')
          echo "Initialize response: $RESP"
          echo "$RESP" | grep -q '"result"' && echo "PASS: Streamable HTTP initialize succeeded" || { echo "FAIL: initialize failed"; exit 1; }

      - name: Smoke - no secret logging
        run: |
          LOGS=$(docker logs mcp-smoke 2>&1)
          if echo "$LOGS" | grep -qiE '(sk-or-v1-|sk-[a-f0-9]{20,}|ghp_[a-zA-Z0-9]{36})'; then
            echo "FAIL: potential secret found in container logs"
            exit 1
          fi
          echo "PASS: no secret logging detected"

      - name: Cleanup
        if: always()
        run: docker rm -f mcp-smoke || true

  # Gate 6: pip-audit
  pip-audit:
    name: Gate 6 - pip-audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install MCP dependencies (runtime only, matching Docker image)
        working-directory: cognee-mcp
        run: uv sync --no-dev

      - name: Run pip-audit (no --ignore-unfixed)
        working-directory: cognee-mcp
        env:
          PIPAPI_PYTHON_LOCATION: ${{ github.workspace }}/cognee-mcp/.venv/bin/python
        run: |
          uv pip install pip
          uv run --with pip-audit pip-audit --strict --progress-spinner off
        continue-on-error: false

  # Gate 7: Trivy scan (no --ignore-unfixed)
  trivy-scan:
    name: Gate 7 - Trivy Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scan
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -f cognee-mcp/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:scan \
            .

      - name: Run Trivy on image (no --ignore-unfixed)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: false

  # Gate 8: Syft CycloneDX SBOM
  syft-sbom:
    name: Gate 8 - Syft SBOM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image for SBOM
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            -f cognee-mcp/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:sbom \
            .

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:sbom
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Assert SBOM contains engine 1.4.0 and MCP 0.5.4
        run: |
          python -c "
          import json
          with open('sbom.cyclonedx.json') as f:
              sbom = json.load(f)
          components = {c['name']: c for c in sbom.get('components', [])}
          assert 'cognee' in components, 'cognee not in SBOM'
          assert components['cognee']['version'] == '1.4.0', f'cognee version: {components[\"cognee\"][\"version\"]}'
          assert 'cognee-mcp' in components, 'cognee-mcp not in SBOM'
          assert components['cognee-mcp']['version'] == '0.5.4', f'cognee-mcp version: {components[\"cognee-mcp\"][\"version\"]}'
          print('PASS: SBOM contains cognee 1.4.0 and cognee-mcp 0.5.4')
          "

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  # Gate 9: License inventory/review
  license-inventory:
    name: Gate 9 - License Inventory
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install MCP dependencies
        working-directory: cognee-mcp
        run: uv sync

      - name: Generate license inventory
        working-directory: cognee-mcp
        run: |
          uv run pip install pip-licenses
          uv run pip-licenses --format=json --output-file=license-inventory.json
          uv run pip-licenses --summary

      - name: Review licenses against policy
        working-directory: cognee-mcp
        run: |
          python -c "
          import json
          with open('license-inventory.json') as f:
              licenses = json.load(f)
          # Permissive licenses accepted by project policy
          ACCEPTED = {'Apache-2.0','MIT','BSD-2-Clause','BSD-3-Clause','ISC','Python-2.0','Unlicense','MPL-2.0','Apache Software License','BSD'}
          flagged = []
          for pkg in licenses:
              lic = pkg.get('License','') or ''
              # Check each license in the string
              for l in lic.split(';'):
                  l = l.strip()
                  if l and l not in ACCEPTED and l != 'UNKNOWN':
                      flagged.append((pkg['Name'], pkg['Version'], l))
          if flagged:
              print('WARNING: Packages with non-permissive licenses:')
              for name, ver, lic in flagged:
                  print(f'  {name} {ver}: {lic}')
              print('Review needed — do not blanket-reject without evidence.')
              # Do not fail — flag for review per task spec
          else:
              print('PASS: All licenses are permissive or accepted by policy')
          "

      - name: Upload license inventory
        uses: actions/upload-artifact@v4
        with:
          name: license-inventory
          path: cognee-mcp/license-inventory.json

  # Gate 10: Secret scan
  secret-scan:
    name: Gate 10 - Secret Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks on source
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify no secrets in Dockerfile
        run: |
          if grep -qiE '(sk-or-v1-|sk-[a-f0-9]{20,}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*["\x27][^"\x27]+["\x27])' cognee-mcp/Dockerfile; then
            echo "FAIL: potential secret in Dockerfile"
            exit 1
          fi
          echo "PASS: no secrets in Dockerfile"

      - name: Verify no secrets in entrypoint
        run: |
          if grep -qiE '(sk-or-v1-|sk-[a-f0-9]{20,}|ghp_[a-zA-Z0-9]{36})' cognee-mcp/entrypoint.sh; then
            echo "FAIL: potential secret in entrypoint"
            exit 1
          fi
          echo "PASS: no secrets in entrypoint"

      - name: Verify no secrets in workflow
        run: |
          # Use sk-or-v1-[a-f0-9]{40,} to match actual OpenRouter keys (40+ hex
          # chars after prefix) without self-matching the regex pattern in this
          # file (which is followed by |, not hex chars).
          if grep -qiE '(sk-or-v1-[a-f0-9]{40,}|sk-[a-f0-9]{20,}|ghp_[a-zA-Z0-9]{36})' .github/workflows/dc-immutable-build.yml; then
            echo "FAIL: potential secret in workflow"
            exit 1
          fi
          echo "PASS: no secrets in workflow"

  # Release: build, push to GHCR, sign, attest
  release:
    name: Release - Build, Push, Sign, Attest
    if: startsWith(github.ref, 'refs/tags/v1.4.0-dc.')
    needs:
      - lockfile-assertion
      - engine-unit-tests
      - mcp-tests
      - postgres-integration
      - container-build-smoke
      - pip-audit
      - trivy-scan
      - syft-sbom
      - license-inventory
      - secret-scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cognee-mcp/Dockerfile
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: true
          sbom: true

      - name: Generate CycloneDX SBOM for release
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-release.cyclonedx.json

      - name: Assert SBOM contains engine 1.4.0 and MCP 0.5.4
        run: |
          python -c "
          import json
          with open('sbom-release.cyclonedx.json') as f:
              sbom = json.load(f)
          components = {c['name']: c for c in sbom.get('components', [])}
          assert 'cognee' in components and components['cognee']['version'] == '1.4.0'
          assert 'cognee-mcp' in components and components['cognee-mcp']['version'] == '0.5.4'
          print('PASS: Release SBOM verified')
          "

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-release
          path: sbom-release.cyclonedx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless sign
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}

      - name: Cosign attest SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign attest --yes \
            --predicate sbom-release.cyclonedx.json \
            --type cyclonedx \
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}

      - name: Verify signature
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/DC-AAIA/cognee/.github/workflows/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}

      - name: Output immutable digest
        run: |
          echo "=== ARTIFACT PUBLISHED ==="
          echo "Image: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "Source commit: ${{ github.sha }}"
          echo "Tag: ${{ github.ref_name }}"
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
